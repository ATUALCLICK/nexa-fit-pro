<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCFF00" />
      <stop offset="50%" stop-color="#A3E635" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Dark Rounded Square -->
  <rect width="512" height="512" rx="112" fill="#0A0A0A" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(163,230,53,0.25)" stroke-width="4" />

  <!-- Iconic Nexa "N" Symbol with Dynamic Neon Lines -->
  <g transform="translate(4, -8)" filter="url(#glow)">
    <!-- Left Stem (forward slanting polygon) -->
    <path d="M 145 375 L 145 155 L 205 155 L 205 375 Z" fill="url(#neonGlow)" />
    
    <!-- Diagonal Slice -->
    <path d="M 195 155 L 315 375 L 265 375 L 145 155 Z" fill="#BFFF00" opacity="0.95" />
    
    <!-- Right Stem -->
    <path d="M 305 155 L 365 155 L 365 375 L 305 375 Z" fill="url(#neonGlow)" />
    
    <!-- Forward Speed Accent Blade -->
    <polygon points="365,155 405,155 365,225" fill="#CCFF00" />
  </g>

  <!-- Small PRO Tag Badge at bottom -->
  <rect x="196" y="405" width="120" height="32" rx="8" fill="#141414" stroke="#A3E635" stroke-width="2" />
  <text x="256" y="427" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="900" fill="#CCFF00" text-anchor="middle" letter-spacing="3">PRO</text>
</svg>
